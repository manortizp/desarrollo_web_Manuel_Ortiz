<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estadística</title>
    <script src="https://code.highcharts.com/highcharts.js"></script>
    <style>
        .galeria {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .galeria img {
            width: 500px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .volver {
            text-align: center;
            margin-top: 40px;
            font-family: Arial, sans-serif;
        }

        .volver a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        .volver a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Estadísticas</h1>

    <div id="grafico-lineas" style="width: 100%; height: 400px;"></div>
    <div id="grafico-torta" style="width: 100%; height: 400px;"></div>
    <div id="grafico-barras" style="width: 100%; height: 400px;"></div>
    
    <div class="volver">
        <p><a href="{{ url_for('index') }}">← Volver al inicio</a></p>
    </div>

    <script src="{{ url_for('static', filename='js/estadistica.js') }}"></script>
</body>
</html>
